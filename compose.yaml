services:
  postgres:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_DB: gsm2sip
      POSTGRES_USER: gsm2sip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  api:
    image: gsm2sip-server:dev
    build:
      context: .
      secrets:
        - proxy_ca
    environment:
      DATABASE_URL: postgresql://gsm2sip:${POSTGRES_PASSWORD:-local-dev-change-me}@postgres:5432/gsm2sip?sslmode=disable
      HTTP_ADDR: :8080
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: gsm2sip-server:dev
    build:
      context: .
      secrets:
        - proxy_ca
    entrypoint: ["/usr/local/bin/gsm2sip-worker"]
    environment:
      DATABASE_URL: postgresql://gsm2sip:${POSTGRES_PASSWORD:-local-dev-change-me}@postgres:5432/gsm2sip?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.10.0-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:

secrets:
  proxy_ca:
    file: ${CODEX_PROXY_CERT:-.docker/empty-proxy-ca}

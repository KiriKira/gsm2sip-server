# SoulGem production stack from prebuilt images: nothing is compiled on the
# server.
#
#   curl -fsSLO https://raw.githubusercontent.com/KiriKira/gsm2sip-server/main/deploy/compose.yaml
#   curl -fsSL https://raw.githubusercontent.com/KiriKira/gsm2sip-server/main/deploy/env.example -o .env
#   # fill in .env, then:
#   docker compose up -d
#
# The API listens on ${HTTP_BIND_ADDR:-127.0.0.1}:${HTTP_PORT}; put a reverse
# proxy in front of it, or bind it to a LAN/Tailscale address and let the
# phones use http:// directly. Calls need a TURN relay that both phones can
# reach: run deploy/turn/compose.yaml with the same .env, or use the
# all-in-one image, which manages one itself. See docs/deploy-images.md.
name: gsm2sip

services:
  postgres:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_DB: gsm2sip
      POSTGRES_USER: gsm2sip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  api:
    image: ghcr.io/kirikira/gsm2sip-server:${GSM2SIP_VERSION:-main}
    environment:
      DATABASE_URL: postgresql://gsm2sip:${POSTGRES_PASSWORD}@postgres:5432/gsm2sip?sslmode=disable
      HTTP_ADDR: :8080
      # Ignored by 0.4. A release before 0.4 reads them, so rolling back
      # only GSM2SIP_VERSION keeps calls on RTC without Asterisk.
      RTC_MEDIA_ENABLED: ${RTC_MEDIA_ENABLED:-true}
      RTC_CONTROL_ENABLED: ${RTC_CONTROL_ENABLED:-true}
      SIP_COMPATIBILITY_ENABLED: ${SIP_COMPATIBILITY_ENABLED:-false}
      RTC_STUN_URLS: ${RTC_STUN_URLS:-}
      RTC_TURN_URLS: ${RTC_TURN_URLS:-}
      RTC_TURN_SHARED_SECRET: ${RTC_TURN_SHARED_SECRET:-}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?set a stable base64-encoded 32-byte key in .env}
    ports:
      - "${HTTP_BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ghcr.io/kirikira/gsm2sip-server:${GSM2SIP_VERSION:-main}
    entrypoint: ["/usr/local/bin/gsm2sip-worker"]
    environment:
      DATABASE_URL: postgresql://gsm2sip:${POSTGRES_PASSWORD}@postgres:5432/gsm2sip?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:

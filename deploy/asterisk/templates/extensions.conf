[general]
static = yes
writeprotect = yes
clearglobalvars = no

[gsm-client]
; Only the one-shot URI token reaches Stasis. Client-provided X-GSM headers
; are deliberately ignored in this context.
exten => _call!,1,Stasis(gsm2sip,client-intent,${EXTEN:5})
 same => n,Hangup()

[gsm-gateway]
; This context is assigned only to a Digest-authenticated gateway endpoint.
; The coordinator still validates all metadata and the endpoint binding.
exten => s,1,Set(GSM2SIP_CALL_ID=${PJSIP_HEADER(read,X-GSM-Call-Id)})
 same => n,Set(GSM2SIP_PROTOCOL_VERSION=${PJSIP_HEADER(read,X-GSM-Protocol-Version)})
 same => n,Set(GSM2SIP_SIM_ID=${PJSIP_HEADER(read,X-GSM-Sim-Id)})
 same => n,Set(GSM2SIP_MAPPING_REVISION=${PJSIP_HEADER(read,X-GSM-Mapping-Revision)})
 same => n,Stasis(gsm2sip,gateway-inbound,${GSM2SIP_CALL_ID},${GSM2SIP_SIM_ID},${GSM2SIP_MAPPING_REVISION},${GSM2SIP_PROTOCOL_VERSION})
 same => n,Hangup()
exten => _.,1,Goto(s,1)

; ARI creates a Local wrapper, puts it in Stasis, then dials the wrapper.
; The called PJSIP channel gets trusted protocol headers before its INVITE and
; enters Stasis after answer. The Local wrapper is control-only.
[gsm2sip-ari-gateway]
exten => s,1,Set(__GSM2SIP_LEG_KIND=gateway-leg)
 same => n,Dial(PJSIP/${GSM2SIP_DESTINATION}@${GSM2SIP_ENDPOINT},,b(gsm2sip-gateway-headers^s^1)U(gsm2sip-stasis-leg^s^1))
 same => n,Hangup()

[gsm2sip-ari-client]
exten => s,1,Set(__GSM2SIP_LEG_KIND=client-leg)
 same => n,Dial(PJSIP/${GSM2SIP_ENDPOINT},,b(gsm2sip-client-headers^s^1)U(gsm2sip-stasis-leg^s^1))
 same => n,Hangup()

[gsm2sip-gateway-headers]
exten => s,1,Set(PJSIP_HEADER(add,X-GSM-Protocol-Version)=${GSM2SIP_PROTOCOL_VERSION})
 same => n,Set(PJSIP_HEADER(add,X-GSM-Call-Id)=${GSM2SIP_CALL_ID})
 same => n,Set(PJSIP_HEADER(add,X-GSM-Sim-Id)=${GSM2SIP_SIM_ID})
 same => n,Set(PJSIP_HEADER(add,X-GSM-Mapping-Revision)=${GSM2SIP_MAPPING_REVISION})
 same => n,Return()

[gsm2sip-client-headers]
exten => s,1,Set(PJSIP_HEADER(add,X-GSM2SIP-Call-ID)=${GSM2SIP_CALL_ID})
 same => n,Return()

[gsm2sip-stasis-leg]
exten => s,1,Stasis(gsm2sip,${GSM2SIP_LEG_KIND},${GSM2SIP_CALL_ID})
 same => n,Return()

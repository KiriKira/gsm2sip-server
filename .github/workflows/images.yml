name: Container images

# Prebuilt images so a server only pulls and runs (deploy/compose.yaml):
#   ghcr.io/kirikira/gsm2sip-server    API, worker and admin CLI
#   ghcr.io/kirikira/gsm2sip-asterisk  pinned Asterisk with the gsm2sip config
#   ghcr.io/kirikira/gsm2sip           all-in-one: both of the above plus PostgreSQL
# Each architecture builds natively, then deploy/compose.yaml is started from
# the freshly built images and checked before anything is pushed.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - cmd/**
      - internal/**
      - migrations/**
      - go.mod
      - go.sum
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SERVER_IMAGE: ghcr.io/kirikira/gsm2sip-server
  ASTERISK_IMAGE: ghcr.io/kirikira/gsm2sip-asterisk
  ALLINONE_IMAGE: ghcr.io/kirikira/gsm2sip

jobs:
  build:
    name: Build and smoke-test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
      ARCH_TAG: build-${{ github.sha }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SERVER_IMAGE }}

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: ${{ env.SERVER_IMAGE }}:ci-smoke
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}

      - name: Build Asterisk image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/asterisk/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: ${{ env.ASTERISK_IMAGE }}:ci-smoke
          cache-from: type=gha,scope=asterisk-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=asterisk-${{ matrix.arch }}

      - name: Smoke-test deploy/compose.yaml with the built images
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          cp deploy/compose.yaml "$smoke/compose.yaml"
          cd "$smoke"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout sip.key -out sip.crt -subj /CN=sip.localhost \
            -addext subjectAltName=DNS:sip.localhost 2>/dev/null
          {
            echo "GSM2SIP_VERSION=ci-smoke"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "ARI_PASSWORD=$(openssl rand -hex 16)"
            echo "SECRETS_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "SIP_SERVER_NAME=sip.localhost"
            echo "SIP_CA_PEM_FILE=/run/secrets/sip_tls_cert"
          } > .env
          chmod 600 .env
          dump() { docker compose ps -a || true; docker compose logs --no-color --tail 200 || true; }
          trap dump ERR
          docker compose up -d --pull missing
          for _ in $(seq 1 90); do
            curl --fail --silent --max-time 2 http://127.0.0.1:8080/readyz >/dev/null && break
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz
          echo
          curl --fail --silent --show-error http://127.0.0.1:8080/v1/capabilities | tee capabilities.json
          echo
          grep -q '"mesh"' capabilities.json
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q asterisk)")" = healthy
          test "$(docker inspect --format '{{.State.Status}}' "$(docker compose ps -q worker)")" = running
          docker compose run --rm --no-deps --entrypoint /usr/local/bin/gsm2sip-admin api \
            owner create --name ci-smoke >/dev/null
          docker compose down -v

      - name: Build the all-in-one image from the tested images
        run: |
          set -euo pipefail
          # The default (docker driver) builder sees the images loaded above.
          docker buildx build --builder default --load \
            --build-arg "SERVER_IMAGE=$SERVER_IMAGE:ci-smoke" \
            --build-arg "ASTERISK_IMAGE=$ASTERISK_IMAGE:ci-smoke" \
            --label org.opencontainers.image.source=https://github.com/KiriKira/gsm2sip-server \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --file deploy/allinone/Dockerfile --tag "$ALLINONE_IMAGE:ci-smoke" .

      - name: Smoke-test the all-in-one image, including a restart
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs --tail 200 aio || true' ERR
          docker run -d --name aio -e SIP_SERVER_NAME=sip.localhost \
            -p 127.0.0.1:18080:8080 -v aio-data:/data "$ALLINONE_IMAGE:ci-smoke"
          wait_ready() {
            for _ in $(seq 1 90); do
              curl --fail --silent --max-time 2 http://127.0.0.1:18080/readyz >/dev/null && return 0
              sleep 2
            done
            return 1
          }
          wait_healthy() {
            for _ in $(seq 1 40); do
              [ "$(docker inspect --format '{{.State.Health.Status}}' aio)" = healthy ] && return 0
              sleep 5
            done
            return 1
          }
          wait_ready
          curl --fail --silent --show-error http://127.0.0.1:18080/v1/capabilities | grep '"mesh"' >/dev/null
          docker exec aio gsm2sip-admin owner create --name ci-smoke >/dev/null
          wait_healthy
          docker restart aio
          wait_ready
          wait_healthy
          docker exec aio gsm2sip-admin owner create --name ci-smoke-after-restart >/dev/null
          docker logs aio 2>&1 | grep -c 'generated secrets_encryption_key' | grep -qx 1
          docker rm -f aio
          docker volume rm aio-data

      - name: Smoke-test the all-in-one image with plain SIP over UDP
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs --tail 200 aio-udp || true' ERR
          docker run -d --name aio-udp -e SIP_TRANSPORT=udp -e SIP_SERVER_NAME=192.0.2.10 \
            -e PUBLIC_IP=192.0.2.10 -p 127.0.0.1:18081:8080 "$ALLINONE_IMAGE:ci-smoke"
          for _ in $(seq 1 90); do
            curl --fail --silent --max-time 2 http://127.0.0.1:18081/readyz >/dev/null && break
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:18081/readyz
          for _ in $(seq 1 40); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' aio-udp)" = healthy ] && break
            sleep 5
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' aio-udp)" = healthy
          # Asterisk listens on UDP 5060 (0x13C4) and no certificate was generated.
          docker exec aio-udp sh -c 'grep -qi ":13C4 " /proc/net/udp /proc/net/udp6'
          docker exec aio-udp test ! -e /data/tls/sip.crt
          docker logs aio-udp 2>&1 | grep 'SIP over UDP without TLS' >/dev/null
          docker rm -f -v aio-udp

      - name: Smoke-test the all-in-one image with no address configured (host network)
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs --tail 200 aio-auto || true' ERR
          docker run -d --name aio-auto --network host -e SIP_TRANSPORT=udp -e HTTP_PORT=18082 \
            "$ALLINONE_IMAGE:ci-smoke"
          for _ in $(seq 1 90); do
            curl --fail --silent --max-time 2 http://127.0.0.1:18082/readyz >/dev/null && break
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:18082/readyz
          for _ in $(seq 1 40); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' aio-auto)" = healthy ] && break
            sleep 5
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' aio-auto)" = healthy
          # No fixed external address: Asterisk picks the interface per phone.
          docker exec aio-auto sh -c 'f=$(ls /tmp/gsm2sip-asterisk.*/pjsip.conf) && grep -q transport-udp "$f" && ! grep -q external_ "$f"'
          docker exec aio-auto gsm2sip-admin owner create --name ci-auto >/dev/null
          docker rm -f -v aio-auto
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep ci-smoke

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested images under a per-architecture tag
        if: env.PUSH == 'true'
        run: |
          set -euo pipefail
          for image in "$SERVER_IMAGE" "$ASTERISK_IMAGE" "$ALLINONE_IMAGE"; do
            docker tag "$image:ci-smoke" "$image:$ARCH_TAG"
            docker push "$image:$ARCH_TAG"
          done

  publish:
    name: Publish multi-arch tags
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: placeholder
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Combine the tested per-architecture images
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          ARCH_PREFIX: build-${{ github.sha }}
        run: |
          set -euo pipefail
          for image in "$SERVER_IMAGE" "$ASTERISK_IMAGE" "$ALLINONE_IMAGE"; do
            args=()
            while read -r tag; do
              [ -n "$tag" ] && args+=(--tag "$image:${tag#placeholder:}")
            done <<< "$TAGS"
            docker buildx imagetools create "${args[@]}" \
              "$image:$ARCH_PREFIX-amd64" "$image:$ARCH_PREFIX-arm64"
            docker buildx imagetools inspect "$image:sha-${GITHUB_SHA::7}"
          done
